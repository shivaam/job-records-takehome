[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-records-summary"
version = "0.1.0"
description = "Validate job execution records and summarize each job's latest outcome"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff==0.16.10",
    "mypy==2.4.0",
]

[project.scripts]
job-records = "job_records.cli:main"

[tool.setuptools.packages.find]
include = ["job_records*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["job_records"]
strict = true
